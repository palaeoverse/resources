# This workflow exists so that the website is always in sync with some documents
# stored in this repo.
#
# It triggers any time there is a change to a document in one of the 
# `paths` below. It sends a "dispatch" notification to the workflow "sync-docs"
# in palaeoverse/palaeoverse.github.io, which triggers a run to rebuild the 
# website with the new documents.

on:
  push:
    branches: main
    paths:
      - AI_policy.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md

name: Notify palaeoverse website

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync-docs in palaeoverse.github.io
        run: |
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/palaeoverse/palaeoverse.github.io/dispatches \
            -d '{"event_type":"sync-docs"}'